name: Build BedFight

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build plugin
        run: mvn -B -ntp clean package
      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: BedFight-${{ github.sha }}
          path: target/BedFight-*.jar
          if-no-files-found: error
